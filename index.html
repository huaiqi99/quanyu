<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千律州 · 资料库</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:32px;
    background:#F0EFED;
    background-image:
      repeating-linear-gradient(0deg,transparent,transparent 25px,rgba(1,69,32,.06) 25px,rgba(1,69,32,.06) 26px),
      repeating-linear-gradient(90deg,transparent,transparent 25px,rgba(1,69,32,.06) 25px,rgba(1,69,32,.06) 26px);
    font-family:Georgia,"Times New Roman","Songti SC",serif;
  }
  h1{color:#014520;font-size:34px;letter-spacing:8px}
  p.sub{color:#46505B;letter-spacing:3px}
  a.card{
    display:block;width:280px;padding:26px 0;text-align:center;
    background:#014520;color:#E0C993;
    border:2px solid #E0C993;outline:2px solid #014520;
    border-radius:10px;text-decoration:none;
    font-size:22px;font-weight:bold;letter-spacing:6px;
    box-shadow:6px 6px 0 rgba(1,69,32,.25);
    transition:transform .15s;
  }
  a.card:hover{transform:translate(-2px,-2px);box-shadow:9px 9px 0 rgba(1,69,32,.3)}
</style>
</head>
<body>
  <h1>千律州 · 资料库</h1>
  <p class="sub">点击进入角色档案</p>
  <a class="card" href="段深泉.html">段深泉</a>
</body>
</html>
